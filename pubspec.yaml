name: acendra
description: Acedra Course Selling Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.0
  supabase_flutter: ^2.18.3
  google_fonts: ^8.2.1
  video_player: ^2.9.2
  pdfx: ^2.9.0
  # Browser file input; already present transitively, now used directly.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  # Flutter 3.44 pins meta 1.18.0; build_runner >=2.15.2 requires newer meta via analyzer.
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
