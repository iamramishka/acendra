name: acendra
description: Acedra Course Selling Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^14.6.2
  supabase_flutter: ^2.8.4
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  # Flutter 3.44 pins meta 1.18.0; build_runner >=2.15.2 requires newer meta via analyzer.
  build_runner: '>=2.15.1 <2.15.2'

flutter:
  uses-material-design: true
