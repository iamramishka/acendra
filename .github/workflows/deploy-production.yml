name: Deploy to Production

# Audit-001: deploy only a dev commit that already passed "Flutter baseline".
# Runs after that workflow completes; the production environment's required
# reviewer approves each deploy. To redeploy, re-run this workflow's run.
on:
  workflow_run:
    workflows: ["Flutter baseline"]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

# Never run two deploys at once; a newer commit waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    environment: production
    # Only a successful push run on this repository's dev branch. Pull-request
    # runs (including forks whose branch is also named "dev") never deploy.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    # Requires these repository secrets (Settings → Secrets → Actions):
    #   DEPLOY_SSH_PRIVATE_KEY  — ed25519 private key for ubuntu@3.25.99.105
    #   DEPLOY_HOST             — 3.25.99.105
    #   DEPLOY_USER             — deploy
    #   SUPABASE_URL               — https://<project>.supabase.co
    #   SUPABASE_PUBLISHABLE_KEY   — publishable/anon key only (never service-role)

    steps:
      # Build the exact commit CI tested, not the latest dev head.
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Same toolchain and lockfile as flutter-ci.yml.
      - name: Set up Flutter (3.44.0, matches CI)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build Flutter Web (release)
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Security gate: reject the build if any service-role key pattern
      # appears in the output. A service-role JWT starts with a specific
      # header that differs from the anon key.
      - name: Secret scan on build output
        run: |
          set +e
          # Supabase service-role JWTs have "role":"service_role" in their payload
          HITS=$(grep -rl '"role":"service_role"\|service_role\b' build/web/ 2>/dev/null | wc -l)
          set -e
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Possible Supabase service-role key found in build/web/ — aborting deploy"
            grep -rl '"role":"service_role"\|service_role\b' build/web/ 2>/dev/null
            exit 1
          fi
          echo "Secret scan passed — no service-role key found."

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # Secret is stored as base64 to avoid all line-ending corruption issues
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the decoded key is parseable by ssh-keygen
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release and Nginx config to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          RELEASE_DIR="/var/www/acendra/releases/${TIMESTAMP}"

          echo "Uploading to ${RELEASE_DIR} ..."
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/web/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          # Stage the candidate config in a deploy-user-only directory (not
          # world-writable /tmp) so it cannot be swapped before sudo installs it.
          echo "Uploading Nginx config ..."
          rsync -az --chmod=F600 \
            --rsync-path="mkdir -p -m 700 /var/www/acendra/.deploy && rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            server/nginx.conf \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/acendra/.deploy/nginx.conf"

          echo "Switching symlink and reloading Nginx ..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -e
          # Apply the updated Nginx config BEFORE switching the release, if the
          # site file exists (set up by setup-ssl.sh). A rejected config is rolled
          # back and aborts the deploy, so a bad file is never left installed.
          # Falls back to plain reload when HTTPS is not yet provisioned.
          if [ -f /etc/nginx/sites-available/acendra ]; then
            sudo /usr/bin/install -m 644 /etc/nginx/sites-available/acendra /etc/nginx/sites-available/acendra.bak
            sudo /usr/bin/install -m 644 /var/www/acendra/.deploy/nginx.conf /etc/nginx/sites-available/acendra
            if ! sudo /usr/sbin/nginx -t; then
              echo "Nginx rejected the new config; restoring previous config" >&2
              sudo /usr/bin/install -m 644 /etc/nginx/sites-available/acendra.bak /etc/nginx/sites-available/acendra
              exit 1
            fi
          fi
          # Atomic symlink switch (temp + rename avoids race)
          ln -s "${RELEASE_DIR}" /var/www/acendra/next
          mv -T /var/www/acendra/next /var/www/acendra/current
          sudo systemctl reload nginx
          # Keep last 5 releases; prune older ones
          ls -dt /var/www/acendra/releases/*/ | tail -n +6 | xargs -r rm -rf
          echo "Live: ${RELEASE_DIR}"
          EOF

      - name: Verify deployed security policy
        run: node tool/csa187_headers.mjs https://3-25-99-105.sslip.io

      - name: Smoke test
        run: |
          echo "Waiting for Nginx to settle ..."
          sleep 5
          DOMAIN="3-25-99-105.sslip.io"

          # Verify HTTPS is live and returns 200.
          HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${DOMAIN}" || echo "000")
          echo "HTTPS status: ${HTTPS_STATUS}"

          # Test the owner's IP entry point; TLS uses this server's certificate hostname.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --no-location "http://3.25.99.105/" || echo "000")
          echo "HTTP→HTTPS redirect status: ${HTTP_STATUS}"

          # Check required security headers on the HTTPS response.
          HEADERS=$(curl -sI --max-time 10 "https://${DOMAIN}" 2>/dev/null || echo "")

          FAIL=0
          [ "$HTTPS_STATUS" != "200" ]          && echo "::error::HTTPS not live (status ${HTTPS_STATUS})" && FAIL=1
          [ "$HTTP_STATUS" != "301" ] && [ "$HTTP_STATUS" != "302" ] \
                                          && echo "::error::HTTP does not redirect to HTTPS (status ${HTTP_STATUS})" && FAIL=1
          if ! grep -qi '^strict-transport-security:' <<< "$HEADERS"; then
            echo "::error::Missing Strict-Transport-Security header"
            FAIL=1
          fi
          if ! grep -qi '^x-content-type-options:' <<< "$HEADERS"; then
            echo "::error::Missing X-Content-Type-Options header"
            FAIL=1
          fi
          if ! grep -qi '^x-frame-options:\|frame-ancestors' <<< "$HEADERS"; then
            echo "::error::Missing X-Frame-Options / frame-ancestors header"
            FAIL=1
          fi
          if grep -qi '^server:.*nginx.*[0-9]' <<< "$HEADERS"; then
            echo "::error::Server header discloses Nginx version"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "One or more checks failed. Run server/setup-ssl.sh on the production server"
            echo "to provision the TLS certificate and install the Nginx config."
            exit 1
          fi

          echo "Smoke test passed — HTTPS live, HTTP redirects, security headers present."

      - name: Summary
        run: |
          echo "### Deploy complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.event.workflow_run.head_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.event.workflow_run.head_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI run | ${{ github.event.workflow_run.html_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://3-25-99-105.sslip.io |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | ${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
