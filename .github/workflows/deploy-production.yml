name: Deploy to Production

# Audit-001: deploy only a dev commit that already passed "Flutter baseline".
# Runs after that workflow completes; the production environment's required
# reviewer approves each deploy. To redeploy, re-run this workflow's run.
on:
  workflow_run:
    workflows: ["Flutter baseline"]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

# Never run two deploys at once; a newer commit waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    environment: production
    # Only a successful push run on this repository's dev branch. Pull-request
    # runs (including forks whose branch is also named "dev") never deploy.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    # Requires these repository secrets (Settings → Secrets → Actions):
    #   DEPLOY_SSH_PRIVATE_KEY  — ed25519 private key for ubuntu@3.25.99.105
    #   DEPLOY_HOST             — 3.25.99.105
    #   DEPLOY_USER             — deploy
    #   SUPABASE_URL               — https://<project>.supabase.co
    #   SUPABASE_PUBLISHABLE_KEY   — publishable/anon key only (never service-role)

    steps:
      # Build the exact commit CI tested, not the latest dev head.
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Same toolchain and lockfile as flutter-ci.yml.
      - name: Set up Flutter (3.44.0, matches CI)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build Flutter Web (release)
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Security gate: reject the build if any service-role key pattern
      # appears in the output. A service-role JWT starts with a specific
      # header that differs from the anon key.
      - name: Secret scan on build output
        run: |
          set +e
          # Supabase service-role JWTs have "role":"service_role" in their payload
          HITS=$(grep -rl '"role":"service_role"\|service_role\b' build/web/ 2>/dev/null | wc -l)
          set -e
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Possible Supabase service-role key found in build/web/ — aborting deploy"
            grep -rl '"role":"service_role"\|service_role\b' build/web/ 2>/dev/null
            exit 1
          fi
          echo "Secret scan passed — no service-role key found."

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # Secret is stored as base64 to avoid all line-ending corruption issues
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the decoded key is parseable by ssh-keygen
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          RELEASE_DIR="/var/www/acendra/releases/${TIMESTAMP}"

          echo "Uploading to ${RELEASE_DIR} ..."
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/web/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          echo "Switching symlink and reloading Nginx ..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -e
          # Atomic symlink switch (temp + rename avoids race)
          ln -s "${RELEASE_DIR}" /var/www/acendra/next
          mv -T /var/www/acendra/next /var/www/acendra/current
          sudo systemctl reload nginx
          # Keep last 5 releases; prune older ones
          ls -dt /var/www/acendra/releases/*/ | tail -n +6 | xargs -r rm -rf
          echo "Live: ${RELEASE_DIR}"
          EOF

      - name: Smoke test
        run: |
          echo "Waiting for Nginx to settle ..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.DEPLOY_HOST }})
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test failed — HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test passed."

      - name: Summary
        run: |
          echo "### Deploy complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.event.workflow_run.head_sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.event.workflow_run.head_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI run | ${{ github.event.workflow_run.html_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://3-25-99-105.sslip.io |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | ${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
