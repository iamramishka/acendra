name: Flutter baseline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify SDK and restore locked Flutter dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
      - name: Check all application and test formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze without suppressing diagnostics
        run: flutter analyze --no-pub
      - name: Run all Flutter tests with coverage
        run: flutter test --no-pub --coverage
      - name: Verify receipt file selection in Chrome
        timeout-minutes: 5
        run: flutter test --no-pub --platform chrome --timeout 30s test/browser/receipt_file_picker.browser.dart
      - name: Build release web application with no backend credentials
        run: flutter build web --release --no-pub
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Restore locked tooling dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify history and built release assets for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/csa188-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          node tool/csa188_hosted_scan.mjs history "$scanner_dir/gitleaks"
          node tool/csa188_hosted_scan.mjs assets "$scanner_dir/gitleaks"
      - name: Run isolated tooling regression tests
        run: npm run tool:test
      - name: Retain synthetic test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
