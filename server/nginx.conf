# Acendra — Nginx configuration
# Domain: 3-25-99-105.sslip.io
# TLS cert: /etc/letsencrypt/live/3-25-99-105.sslip.io/ (issued by setup-ssl.sh)
#
# Deploy: this file is uploaded to /etc/nginx/sites-available/acendra on each
# deploy and reloaded. The deploy user needs passwordless sudo for:
#   /usr/bin/install -m 644 /etc/nginx/sites-available/acendra /etc/nginx/sites-available/acendra.bak
#   /usr/bin/install -m 644 /var/www/acendra/.deploy/nginx.conf /etc/nginx/sites-available/acendra
#   /usr/bin/install -m 644 /etc/nginx/sites-available/acendra.bak /etc/nginx/sites-available/acendra
# The candidate is staged in the deploy-only /var/www/acendra/.deploy (mode 700).
#   /usr/sbin/nginx -t
#   /bin/systemctl reload nginx
# (setup-ssl.sh writes those sudoers entries automatically)

# Redirect all HTTP to HTTPS
server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name 3-25-99-105.sslip.io 3.25.99.105;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://3-25-99-105.sslip.io$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 3-25-99-105.sslip.io 3.25.99.105;

    ssl_certificate     /etc/letsencrypt/live/3-25-99-105.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-25-99-105.sslip.io/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/3-25-99-105.sslip.io/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ──────────────────────────────────────────────────────
    # HSTS: tell browsers to always use HTTPS for 2 years (must not be added
    # before TLS works or it will lock users out of HTTP).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP tuned for Flutter web + Google Fonts + Supabase + protected Mux video.
    # The default Flutter loader fetches CanvasKit JS/WASM from www.gstatic.com.
    # Flutter compiled JS requires 'unsafe-inline' and 'unsafe-eval';
    # CanvasKit WASM additionally requires 'wasm-unsafe-eval'.
    # Mux manifests/segments use its HTTPS subdomains; MediaSource uses blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com/flutter-canvaskit/ 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.gstatic.com/flutter-canvaskit/ https://fonts.gstatic.com https://*.supabase.co wss://*.supabase.co https://*.mux.com; media-src 'self' blob: https://*.mux.com; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self'" always;

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── App root ──────────────────────────────────────────────────────────────
    root  /var/www/acendra/current;
    index index.html;

    # Flutter web: all routes fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter build filenames are reused between releases. Revalidate all
    # responses so returning browsers receive the current code and assets.
    expires -1;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        image/svg+xml;
}
