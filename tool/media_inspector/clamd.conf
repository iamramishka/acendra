# Load this exact policy in a private daemon; keep the real signature DB current.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
StreamMaxLength 50M
MaxFileSize 50M
MaxScanSize 128M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 8000
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 10
CommandReadTimeout 10
MaxThreads 1
MaxQueue 2
